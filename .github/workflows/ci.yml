name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate dual Plugin metadata
        run: python3 scripts/validate-plugin.py
      - name: Check README Skill list
        run: python3 scripts/update-readme-skills.py --check
      - name: Require Plugin version bump
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if ! git diff --quiet "$BASE_SHA" HEAD -- plugins/agent-skills; then
            if git cat-file -e "$BASE_SHA:plugins/agent-skills/.codex-plugin/plugin.json" 2>/dev/null; then
              base_version=$(git show "$BASE_SHA:plugins/agent-skills/.codex-plugin/plugin.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
              head_version=$(python3 -c 'import json; print(json.load(open("plugins/agent-skills/.codex-plugin/plugin.json"))["version"])')
              python3 - "$base_version" "$head_version" <<'PY'
          import re
          import sys

          pattern = re.compile(r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$")
          base_text, head_text = sys.argv[1:]
          base_match = pattern.fullmatch(base_text)
          head_match = pattern.fullmatch(head_text)
          if not base_match or not head_match:
              raise SystemExit(f"Plugin versions must be strict semver: {base_text} -> {head_text}")
          base = tuple(map(int, base_match.groups()))
          head = tuple(map(int, head_match.groups()))
          if head <= base:
              raise SystemExit(f"Plugin version must increase: {base_text} -> {head_text}")
          PY
            fi
          fi

  excel-diagram-interchange:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install Skill dependency
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Compile Skill Python
        run: >-
          python -m compileall -q
          plugins/agent-skills/skills/excel-diagram-interchange/scripts
          scripts/audit-excel-diagram-interchange.py
          tests/test_excel_diagram_interchange.py
          tests/test_excel_diagram_interchange_boundary.py
          tests/test_excel_diagram_interchange_fixtures.py
      - name: Test excel-diagram-interchange
        run: python -m unittest discover -s tests -p 'test_excel_diagram_interchange*.py' -v
      - name: Test fixture module in isolation
        run: python -m unittest discover -s tests -p 'test_excel_diagram_interchange_fixtures.py' -v
      - name: Run Skill security audit
        run: python scripts/audit-excel-diagram-interchange.py
